<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branch Orders → Warehouse</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14171f;--mut:#667085;--bd:#e4e7ee;--ac:#4f46e5;--ac2:#7c3aed;--acx:#fff;--soft:#eef0ff;--err:#dc2626;--sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
--c-New:#d97706;--c-Picking:#2563eb;--c-Shipped:#7c3aed;--c-Delivered:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--tx:#eef0f6;--mut:#98a2b3;--bd:#2a3040;--ac:#818cf8;--ac2:#a78bfa;--acx:#0e1118;--soft:#232845;--err:#f87171;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--c-New:#fbbf24;--c-Picking:#60a5fa;--c-Shipped:#c4b5fd;--c-Delivered:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--tx:#eef0f6;--mut:#98a2b3;--bd:#2a3040;--ac:#818cf8;--ac2:#a78bfa;--acx:#0e1118;--soft:#232845;--err:#f87171;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--c-New:#fbbf24;--c-Picking:#60a5fa;--c-Shipped:#c4b5fd;--c-Delivered:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:820px;margin:0 auto;padding:16px 16px 28px}
button,input,select,textarea{font:inherit;color:inherit}
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh);animation:rise .5s both}
.hero .lg{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px;flex:none}
.hero h1{margin:0;font-size:19px;line-height:1.2}.hero p{margin:2px 0 0;font-size:13px;opacity:.85}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:#9ca3af}.live.on i{background:#4ade80;animation:pulse 1.8s infinite}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:16px 0;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--ac);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.tabs[data-t="1"] .ind{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:10px 8px;font-weight:600;cursor:pointer;border-radius:10px;transition:color .25s;color:var(--mut)}
.tabs button.on{color:var(--acx)}
.view{animation:rise .4s both}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2,.sec{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:700}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--soft)}
.field.bad{border-color:var(--err);animation:shake .35s}
.sel{position:relative}.sel select{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.err{color:var(--err);font-size:12px;margin-top:5px;min-height:0;display:none}.err.show{display:block;animation:rise .25s}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .2s}
.prow+.prow{margin-top:2px}.prow.has{background:var(--soft)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.pn{flex:1;min-width:0}.pn b{display:block;font-weight:600;overflow-wrap:anywhere}.pn small{color:var(--mut)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:18px;line-height:1;transition:transform .12s,background .2s}
.step button:active{transform:scale(.88)}.step button:hover{background:var(--soft)}
.step input{width:50px;height:34px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);outline:none;padding:0}
.step input:focus{border-color:var(--ac)}
textarea.field{resize:vertical;min-height:70px}
.bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));margin:0 -4px 14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.bar .t{flex:1;font-weight:600}.bar .t small{display:block;color:var(--mut);font-weight:400}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;transition:transform .12s,box-shadow .2s,opacity .2s;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{padding:9px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;box-shadow:var(--sh)}
.stat:hover{transform:translateY(-2px)}.stat.on{border-color:var(--ac);background:var(--soft)}
.stat b{display:block;font-size:22px;line-height:1.1}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.order{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
.order.enter{animation:rise .45s both}
.oh{width:100%;display:flex;align-items:center;gap:10px;padding:14px;border:0;background:none;text-align:left;cursor:pointer}
.oh .who{flex:1;min-width:0}.oh .who b{display:block;overflow-wrap:anywhere}.oh .who small{color:var(--mut)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.chev{width:9px;height:9px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .3s;flex:none;margin:0 4px 3px}
.order.open .chev{transform:rotate(225deg) translate(-2px,-2px)}
.ob{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1)}
.order.open .ob{grid-template-rows:1fr}
.obi{overflow:hidden;min-height:0;padding:0 14px}.order.open .obi{padding-bottom:14px}
.li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--bd)}.li b{flex:none}
.note{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);color:var(--mut);font-size:14px}
.prog{display:flex;margin:16px 0 6px}
.st{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative;font-weight:600}
.st i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bd);margin:0 auto 5px;position:relative;z-index:1;transition:background .4s}
.st+.st::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--bd);transition:background .4s}
.st.on i,.st.on+.st.on::before{background:var(--ac)}.st.on{color:var(--tx)}
.empty{text-align:center;padding:36px 12px;color:var(--mut);animation:rise .4s both}.empty span{display:block;font-size:34px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.35s cubic-bezier(.4,0,.2,1);z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:480px){.hero{padding:14px}.hero h1{font-size:17px}.hero p{display:none}.step input{width:42px}.pn small{font-size:12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="hero"><div class="lg">📦</div><div><h1>Branch Orders</h1><p>Send supply requests to the warehouse</p></div><div class="live" id="live"><i></i><span>Offline</span></div></header>
<nav class="tabs" id="tabs" data-t="0"><span class="ind"></span><button id="tB" class="on">New order</button><button id="tW">Warehouse</button></nav>

<section id="vB" class="view">
  <div class="card"><label for="branch">Select your branch</label>
    <div class="sel"><select id="branch" class="field"></select></div><div class="err" id="berr">Please choose a branch first.</div></div>
  <div class="card"><h2>Products</h2><div id="cat"></div>
    <label for="note" style="margin-top:12px">Note to warehouse <span style="color:var(--mut);font-weight:400">(optional)</span></label>
    <textarea id="note" class="field" maxlength="300" placeholder="e.g. Urgent, needed before Friday"></textarea></div>
  <div class="bar"><div class="t" id="tot">No items yet<small>Use + to add products</small></div><button class="btn" id="send" disabled>Send order</button></div>
  <div class="sec">My branch orders</div><div id="mine"></div>
</section>

<section id="vW" class="view" hidden>
  <div class="stats" id="stats"></div>
  <div class="card"><label for="fb">Filter by branch</label><div class="sel"><select id="fb" class="field"></select></div></div>
  <div id="all"></div>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const BRANCHES=["ITECH BACOLOD","GAMEONE BACOLOD","DV BACOLOD","ITECH ILOILO","ITECH DUMAGUETE"];
const PRODUCTS=[
 {sku:"STRAW",name:"Straw",unit:"box",ic:"🥤"},{sku:"NEWS",name:"Newsprint",unit:"bundle",ic:"📰"},
 {sku:"POS",name:"POS Thermal Paper",unit:"box",ic:"🧾"},{sku:"CLING",name:"Half-Size Cling Wrap",unit:"roll",ic:"🎞️"},
 {sku:"TAPE-CLR",name:"Clear Tape",unit:"roll",ic:"📼"},{sku:"TAPE-BRN",name:"Brown Tape",unit:"roll",ic:"📦"},
 {sku:"ECO-S",name:"Eco Bag - Small",unit:"pack",ic:"🛍️"},{sku:"ECO-M",name:"Eco Bag - Medium",unit:"pack",ic:"🛍️"},
 {sku:"ECO-L",name:"Eco Bag - Large",unit:"pack",ic:"🛍️"},{sku:"ECO-XL",name:"Eco Bag - XL",unit:"pack",ic:"🛍️"}
];
const STAT=["New","Picking","Shipped","Delivered"];
let db=null,orders=[],catalog=[],qty={},fStat="All",fBr="All",canEdit=false;
const open=new Set(),seen=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const prods=()=>catalog.length?catalog:PRODUCTS;
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)}

function fillSel(el,first){el.innerHTML=`<option value="">${first}</option>`+BRANCHES.map(b=>`<option>${esc(b)}</option>`).join("")}
fillSel($("branch"),"— Choose branch —");fillSel($("fb"),"All branches");
try{const b=localStorage.getItem("branch");if(b&&BRANCHES.includes(b))$("branch").value=b}catch(e){}
$("branch").onchange=()=>{try{localStorage.setItem("branch",$("branch").value)}catch(e){}$("branch").classList.remove("bad");$("berr").classList.remove("show");renderMine()};
$("fb").onchange=()=>{fBr=$("fb").value||"All";renderAll()};

function tab(w){$("tabs").dataset.t=w?1:0;$("tB").classList.toggle("on",!w);$("tW").classList.toggle("on",w);$("vB").hidden=w;$("vW").hidden=!w}
$("tB").onclick=()=>tab(false);$("tW").onclick=()=>tab(true);

function renderProducts(){
  $("cat").innerHTML=prods().map(p=>`<div class="prow${qty[p.sku]>0?" has":""}" data-r="${esc(p.sku)}"><div class="ico">${esc(p.ic||"📦")}</div>
  <div class="pn"><b>${esc(p.name)}</b><small>per ${esc(p.unit)}</small></div>
  <div class="step"><button type="button" data-sku="${esc(p.sku)}" data-d="-1" aria-label="Decrease ${esc(p.name)}">−</button>
  <input inputmode="numeric" maxlength="4" data-sku="${esc(p.sku)}" value="${qty[p.sku]||0}" aria-label="Quantity ${esc(p.name)}">
  <button type="button" data-sku="${esc(p.sku)}" data-d="1" aria-label="Increase ${esc(p.name)}">+</button></div></div>`).join("");
  updTotal();
}
function setQty(sku,n){
  n=Math.max(0,Math.min(9999,Math.floor(+n)||0));qty[sku]=n;
  const r=document.querySelector(`[data-r="${CSS.escape(sku)}"]`);
  if(r){r.classList.toggle("has",n>0);const i=r.querySelector("input");if(document.activeElement!==i||+i.value!==n)i.value=n}
  updTotal();
}
$("cat").onclick=e=>{const b=e.target.closest("button[data-d]");if(b)setQty(b.dataset.sku,(qty[b.dataset.sku]||0)+ +b.dataset.d)};
$("cat").oninput=e=>{const i=e.target;if(i.dataset.sku){i.value=i.value.replace(/\D/g,"").slice(0,4);setQty(i.dataset.sku,i.value)}};
$("cat").onfocusin=e=>{if(e.target.tagName==="INPUT")e.target.select()};
$("cat").onfocusout=e=>{const i=e.target;if(i.dataset&&i.dataset.sku)i.value=qty[i.dataset.sku]||0};
function updTotal(){
  const l=Object.values(qty).filter(n=>n>0),u=l.reduce((a,b)=>a+b,0);
  $("tot").innerHTML=l.length?`${u} unit${u>1?"s":""}<small>${l.length} product${l.length>1?"s":""} selected</small>`:`No items yet<small>Use + to add products</small>`;
  $("send").disabled=!l.length;
}
$("send").onclick=async()=>{
  const branch=$("branch").value;
  if(!branch){$("branch").classList.remove("bad");void $("branch").offsetWidth;$("branch").classList.add("bad");$("berr").classList.add("show");$("branch").scrollIntoView({behavior:"smooth",block:"center"});return}
  const items=prods().filter(p=>qty[p.sku]>0).map(p=>({sku:p.sku,name:p.name,unit:p.unit,qty:qty[p.sku]}));
  if(!items.length)return;
  if(!db)return toast("Sign in to claude.ai to send orders");
  $("send").disabled=true;$("send").textContent="Sending…";
  try{await db.collection("orders").add({branch,items,note:$("note").value.trim(),status:"New",created:Date.now()});
    qty={};$("note").value="";renderProducts();toast("✔ Order sent to the warehouse")}
  catch(e){toast("Could not send: "+((e&&e.message)||"try again"));updTotal()}
  $("send").textContent="Send order";
};

function ago(t){return new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function card(o,wh){
  const i=Math.max(0,STAT.indexOf(o.status)),nx=STAT[i+1],isOpen=open.has(o.id),isNew=!seen.has(o.id);seen.add(o.id);
  return `<article class="order${isOpen?" open":""}${isNew?" enter":""}" data-id="${esc(o.id)}">
  <button class="oh" aria-expanded="${isOpen}"><div class="who"><b>${esc(o.branch)}</b><small>${ago(o.created)} · ${(o.items||[]).length} item${(o.items||[]).length>1?"s":""}</small></div>
  <span class="badge" style="--c:var(--c-${esc(o.status)})">${esc(o.status)}</span><span class="chev"></span></button>
  <div class="ob"><div class="obi">${(o.items||[]).map(x=>`<div class="li"><span>${esc(x.name)}</span><b>${esc(x.qty)} ${esc(x.unit)}</b></div>`).join("")}
  ${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:""}
  <div class="prog">${STAT.map((s,k)=>`<div class="st${k<=i?" on":""}"><i></i>${s}</div>`).join("")}</div>
  ${wh&&canEdit&&nx?`<button class="btn sm" data-s="${nx}" style="margin-top:10px">Mark as ${nx}</button>`:""}</div></div></article>`;
}
const empty=(e,t)=>`<div class="empty"><span>${e}</span>${t}</div>`;
function renderMine(){
  const b=$("branch").value,l=orders.filter(o=>b&&o.branch===b);
  $("mine").innerHTML=l.length?l.map(o=>card(o,false)).join(""):empty("🗒️",b?"No orders yet for this branch.":"Select a branch to see its orders.");
}
function renderAll(){
  $("stats").innerHTML=["All",...STAT].map(s=>`<button class="stat${s===fStat?" on":""}" data-f="${s}"><b>${s==="All"?orders.length:orders.filter(o=>o.status===s).length}</b><span>${s}</span></button>`).join("");
  const l=orders.filter(o=>(fStat==="All"||o.status===fStat)&&(fBr==="All"||o.branch===fBr));
  $("all").innerHTML=(!canEdit&&orders.length?'<div class="note" style="margin:0 0 10px">View only: warehouse editors can update statuses.</div>':"")+(l.length?l.map(o=>card(o,true)).join(""):empty("📭","No orders match this filter."));
}
$("stats").onclick=e=>{const b=e.target.closest("[data-f]");if(b){fStat=b.dataset.f;renderAll()}};
function onList(e,wh){
  const art=e.target.closest(".order");if(!art)return;const id=art.dataset.id;
  const act=e.target.closest("button[data-s]");
  if(act){act.disabled=true;db.collection("orders").doc(id).update({status:act.dataset.s}).then(()=>toast("Status: "+act.dataset.s)).catch(x=>{act.disabled=false;toast("Not allowed: "+((x&&x.message)||"error"))});return}
  if(e.target.closest(".oh")){const o=art.classList.toggle("open");o?open.add(id):open.delete(id);art.querySelector(".oh").setAttribute("aria-expanded",o)}
}
$("mine").onclick=e=>onList(e,false);$("all").onclick=e=>onList(e,true);
const renderBoth=()=>{renderMine();renderAll()};
renderProducts();renderBoth();
(async()=>{
  try{
    const user=await claude.use("user");canEdit=!!(user&&user.canEdit());
    db=await claude.use("db");
    if(!db){toast("Sign in to claude.ai to place and see orders");return}
    $("live").classList.add("on");$("live").lastChild.textContent="Live";
    const t=setTimeout(()=>toast("Still loading orders…"),10000);
    db.collection("orders").orderBy("created","desc").onSnapshot(s=>{clearTimeout(t);orders=s.docs.map(d=>({id:d.id,...d.data()}));renderBoth()},e=>toast("Load error: "+((e&&e.message)||"")));
    db.collection("catalog").onSnapshot(s=>{catalog=s.docs.map(d=>d.data()).filter(p=>p&&p.sku&&p.name);renderProducts()},()=>{});
  }catch(e){console.error(e)}
})();
</script>
</body>
</html>
